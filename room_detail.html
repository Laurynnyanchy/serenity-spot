<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room Details — Serenity Spot</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.detail-wrap { max-width:1200px; margin:0 auto; padding:calc(var(--nav-h)+40px) 5% 80px; }

/* GALLERY */
.gallery { display:grid; grid-template-columns:2fr 1fr; grid-template-rows:220px 220px; gap:8px; border-radius:var(--radius); overflow:hidden; margin-bottom:40px; }
.gal-main { grid-row:1/3; position:relative; overflow:hidden; }
.gal-sub { position:relative; overflow:hidden; }
.gallery img { width:100%; height:100%; object-fit:cover; transition:transform .5s; cursor:pointer; }
.gallery img:hover { transform:scale(1.04); }

/* CONTENT GRID */
.content-grid { display:grid; grid-template-columns:1fr 360px; gap:40px; align-items:start; }

/* LEFT */
.detail-breadcrumb { display:flex; gap:8px; font-size:.82rem; color:var(--muted); margin-bottom:20px; align-items:center; }
.detail-breadcrumb a { color:var(--gold); }
.detail-type-badge { display:inline-block; background:var(--gold-pale); color:var(--gold); font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:1px; padding:4px 12px; border-radius:20px; border:1px solid rgba(200,151,58,.25); margin-bottom:12px; }
.detail-title { font-family:'Playfair Display',serif; font-size:clamp(1.6rem,4vw,2.4rem); font-weight:700; color:var(--dark); margin-bottom:12px; }
.detail-meta { display:flex; gap:20px; flex-wrap:wrap; margin-bottom:28px; }
.detail-meta-item { display:flex; align-items:center; gap:6px; font-size:.9rem; color:var(--muted); }

.section-sep { height:1px; background:var(--border); margin:32px 0; }
.detail-desc { font-size:.95rem; line-height:1.8; color:var(--text); }

/* AMENITIES */
.amenities-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
.amenity-pill {
  display:flex; align-items:center; gap:10px;
  background:var(--cream); border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:10px 14px;
  font-size:.85rem; color:var(--text);
}
.amenity-pill .icon { color:var(--gold); display:flex; }

/* REVIEWS */
.reviews-list { display:flex; flex-direction:column; gap:20px; margin-top:24px; }
.review-card { background:var(--white); border:1px solid var(--border); border-radius:var(--radius-sm); padding:20px; }
.review-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
.reviewer-name { font-weight:600; font-size:.9rem; color:var(--dark); }
.review-date { font-size:.75rem; color:var(--muted); }
.review-text { font-size:.875rem; color:var(--text); line-height:1.7; }

/* WRITE REVIEW */
.write-review { background:var(--cream); border:1px solid var(--border); border-radius:var(--radius); padding:28px; margin-top:28px; }
.write-review h4 { font-family:'Playfair Display',serif; font-size:1.1rem; color:var(--dark); margin-bottom:20px; }
.star-picker { display:flex; gap:6px; margin-bottom:16px; }
.star-picker button { background:none; border:none; font-size:1.6rem; cursor:pointer; color:var(--border); transition:color .15s; line-height:1; }
.star-picker button.lit { color:var(--gold); }

/* RIGHT — BOOKING BOX */
.booking-box {
  background:var(--white); border:1px solid var(--border);
  border-radius:var(--radius); padding:28px;
  box-shadow:var(--shadow-md); position:sticky; top:calc(var(--nav-h)+20px);
}
.box-price { margin-bottom:20px; }
.box-price .big { font-family:'Playfair Display',serif; font-size:2rem; font-weight:700; color:var(--dark); }
.box-price .small { font-size:.85rem; color:var(--muted); }
.box-highlights { display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
.box-hl { display:flex; align-items:center; gap:8px; font-size:.875rem; color:var(--text); }
.box-hl .chk { color:var(--success); display:flex; }
.box-form { display:flex; flex-direction:column; gap:14px; }
.box-sep { height:1px; background:var(--border); margin:4px 0; }
.price-breakdown { font-size:.85rem; }
.price-row { display:flex; justify-content:space-between; padding:6px 0; color:var(--muted); }
.price-row.total { color:var(--dark); font-weight:700; font-size:.95rem; border-top:1px solid var(--border); margin-top:6px; padding-top:12px; }
.avail-msg { text-align:center; font-size:.8rem; margin-top:10px; min-height:18px; }
.avail-msg.ok { color:var(--success); }
.avail-msg.err { color:var(--error); }

@media(max-width:900px){
  .content-grid { grid-template-columns:1fr; }
  .booking-box { position:static; }
  .gallery { grid-template-columns:1fr 1fr; grid-template-rows:200px; }
  .gal-main { grid-row:auto; grid-column:1/-1; }
}
@media(max-width:540px){
  .gallery { grid-template-columns:1fr; grid-template-rows:auto; }
  .gal-sub { height:140px; }
}
</style>
</head>
<body>
<div id="nav-slot"></div>
<div class="detail-wrap">
  <div class="gallery" id="gallery"></div>
  <div class="content-grid">
    <div class="detail-left" id="detailLeft"></div>
    <aside class="booking-box" id="bookingBox"></aside>
  </div>
  <div id="descSection" style="margin-top:40px"></div>
  <div id="amenSection" style="margin-top:40px"></div>
  <div id="reviewSection" style="margin-top:40px"></div>
</div>

<div id="footer-slot"></div>
<script src="shared.js"></script>
<script>
document.getElementById('nav-slot').innerHTML = navHTML('rooms');
document.getElementById('footer-slot').innerHTML = footerHTML();
sharedInit();

const params = new URLSearchParams(location.search);
const room = getRoom(params.get('id')) || ROOMS[0];
document.title = room.name + ' — Serenity Spot';

// GALLERY
document.getElementById('gallery').innerHTML = `
  <div class="gal-main"><img src="${room.images[0]||room.image}" alt="${room.name}"></div>
  <div class="gal-sub"><img src="${room.images[1]||room.image}" alt="${room.name} interior" loading="lazy"></div>
  <div class="gal-sub"><img src="${room.images[2]||room.image}" alt="${room.name} bathroom" loading="lazy"></div>
`;

// LEFT
document.getElementById('detailLeft').innerHTML = `
  <div class="detail-breadcrumb">
    <a href="rooms.html">← All Rooms</a>
    <span>/</span><span>${room.type}</span>
    <span>/</span><span>${room.name}</span>
  </div>
  <div class="detail-type-badge">${room.type}</div>
  <h1 class="detail-title">${room.name}</h1>
  <div class="detail-meta">
    <div class="detail-meta-item">${ICONS.users} Up to ${room.people} guests</div>
    <div class="detail-meta-item"><span class="rating-wrap">${renderStars(room.rating)}</span> ${room.rating} &middot; ${room.reviews} reviews</div>
    <div class="detail-meta-item" style="color:${room.available?'var(--success)':'var(--error)'}">${room.available ? `${ICONS.checkCircle} Available` : '&#10007; Unavailable'}</div>
  </div>
`;

// BOOKING BOX
const ci = params.get('checkin') || '';
const co = params.get('checkout') || '';
document.getElementById('bookingBox').innerHTML = `
  <div class="box-price">
    <span class="big">${formatKES(room.price)}</span>
    <span class="small"> / night</span>
  </div>
  <div class="box-highlights">
    <div class="box-hl"><span class="chk">${ICONS.check}</span>Free cancellation up to 24h before</div>
    <div class="box-hl"><span class="chk">${ICONS.check}</span>Instant booking confirmation</div>
    <div class="box-hl"><span class="chk">${ICONS.check}</span>M-Pesa & card accepted</div>
  </div>
  <div class="box-form">
    <div class="form-group"><label>Check-in</label><input type="date" class="form-control" id="bCheckin" value="${ci}"></div>
    <div class="form-group"><label>Check-out</label><input type="date" class="form-control" id="bCheckout" value="${co}"></div>
    <div class="form-group">
      <label>Guests</label>
      <select class="form-control" id="bGuests">
        ${[...Array(room.people)].map((_,i)=>`<option>${i+1} Guest${i>0?'s':''}</option>`).join('')}
      </select>
    </div>
    <div class="box-sep"></div>
    <div class="price-breakdown" id="breakdown"></div>
    <button class="btn btn-primary btn-full btn-lg" onclick="checkAvail()">Check Availability</button>
    <div class="avail-msg" id="availMsg"></div>
  </div>
`;

function updateBreakdown(){
  const ci=document.getElementById('bCheckin').value;
  const co=document.getElementById('bCheckout').value;
  const n=calcNights(ci,co);
  const bd=document.getElementById('breakdown');
  if(n>0){
    const sub=room.price*n;
    const total=sub; // No service fee
    bd.innerHTML=`
      <div class="price-row"><span>${formatKES(room.price)} × ${n} night${n>1?'s':''}</span><span>${formatKES(sub)}</span></div>
      <div class="price-row total"><span>Total</span><span>${formatKES(total)}</span></div>
    `;
  } else { bd.innerHTML=''; }
}

document.getElementById('bCheckin').addEventListener('change',updateBreakdown);
document.getElementById('bCheckout').addEventListener('change',updateBreakdown);
updateBreakdown();

function checkAvail(){
  const ci=document.getElementById('bCheckin').value;
  const co=document.getElementById('bCheckout').value;
  const msg=document.getElementById('availMsg');
  if(!ci||!co){ msg.className='avail-msg err'; msg.textContent='Please select both dates.'; return; }
  if(new Date(co)<=new Date(ci)){ msg.className='avail-msg err'; msg.textContent='Check-out must be after check-in.'; return; }
  msg.className='avail-msg ok'; msg.textContent='Available! Proceeding to booking...';
  setTimeout(()=>{
    const n=calcNights(ci,co);
    window.location=`booking.html?id=${room.id}&checkin=${ci}&checkout=${co}&nights=${n}&guests=${document.getElementById('bGuests').value}`;
  },800);
}

// DESCRIPTION
document.getElementById('descSection').innerHTML = `
  <div class="section-sep" style="margin-bottom:32px"></div>
  <div class="s-tag">About This Room</div>
  <h2 class="s-title" style="font-size:1.5rem;margin-bottom:16px">Room Description</h2>
  <p class="detail-desc">${room.fullDesc}</p>
`;

// AMENITIES
document.getElementById('amenSection').innerHTML = `
  <div class="section-sep" style="margin-bottom:32px"></div>
  <div class="s-tag">What's Included</div>
  <h2 class="s-title" style="font-size:1.5rem;margin-bottom:20px">Amenities</h2>
  <div class="amenities-grid">
    ${room.amenities.map(a=>`
      <div class="amenity-pill">
        <span class="icon">${AMENITY_ICONS[a]||ICONS.check}</span>
        ${a}
      </div>
    `).join('')}
  </div>
`;

// REVIEWS
const sampleReviews = [
  {name:'Amina W.', rating:5, date:'March 2025', text:'Absolutely lovely stay! The room was spotless and the bed was incredibly comfortable. Would highly recommend.'},
  {name:'Brian O.', rating:5, date:'February 2025', text:'Great value for money. WiFi was fast, shower hot, and the host was responsive. Will definitely return.'},
  {name:'Carol M.', rating:4, date:'January 2025', text:'Nice room in a good location. A few minor things could be improved but overall a great stay.'},
];
let selectedStars=0;
document.getElementById('reviewSection').innerHTML = `
  <div class="section-sep" style="margin-bottom:32px"></div>
  <div class="s-tag">Guest Feedback</div>
  <h2 class="s-title" style="font-size:1.5rem;margin-bottom:8px">Reviews</h2>
  <p style="color:var(--muted);font-size:.9rem;margin-bottom:24px">${room.rating} &middot; ${room.reviews} reviews</p>
  <div class="reviews-list">
    ${sampleReviews.map(r=>`
      <div class="review-card">
        <div class="review-header">
          <div>
            <div class="reviewer-name">${r.name}</div>
            <div class="rating-wrap" style="margin-top:4px">${renderStars(r.rating)}</div>
          </div>
          <div class="review-date">${r.date}</div>
        </div>
        <div class="review-text">${r.text}</div>
      </div>
    `).join('')}
  </div>
  <div class="write-review">
    <h4>Leave a Review</h4>
    <div class="star-picker" id="starPicker">
      ${[1,2,3,4,5].map(i=>`<button onclick="setStars(${i})" id="sp${i}">★</button>`).join('')}
    </div>
    <div class="form-group" style="margin-bottom:14px"><textarea class="form-control" id="reviewText" placeholder="Share your experience…"></textarea></div>
    <button class="btn btn-primary" onclick="submitReview()">Submit Review</button>
    <p id="reviewMsg" style="font-size:.82rem;margin-top:10px;color:var(--success)"></p>
  </div>
`;

function setStars(n){
  selectedStars=n;
  [1,2,3,4,5].forEach(i=>document.getElementById('sp'+i).classList.toggle('lit',i<=n));
}
function submitReview(){
  const txt=document.getElementById('reviewText').value.trim();
  if(!selectedStars||!txt){ document.getElementById('reviewMsg').style.color='var(--error)'; document.getElementById('reviewMsg').textContent='Please select a rating and write a comment.'; return; }
  document.getElementById('reviewMsg').style.color='var(--success)';
  document.getElementById('reviewMsg').textContent='Thank you! Your review has been submitted.';
  document.getElementById('reviewText').value=''; setStars(0);
}
</script>
</body>
</html>
