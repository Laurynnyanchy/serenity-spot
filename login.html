<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login &mdash; Serenity Spot</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.auth-page {
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:calc(var(--nav-h)+32px) 5% 60px;
  background:linear-gradient(145deg,#120d04 0%,#3a2510 50%,#5c3d18 100%);
  position:relative; overflow:hidden;
}
.auth-bg-photo {
  position:absolute; inset:0;
  background-image:url('https://images.unsplash.com/photo-1631049307264-da0ec9d70304?w=1400&q=70');
  background-size:cover; background-position:center;
  opacity:.18;
}
.auth-card {
  background:var(--white); border-radius:24px; overflow:hidden;
  width:100%; max-width:460px; position:relative; z-index:1;
  box-shadow:0 24px 80px rgba(26,18,8,.35);
}
.auth-header { background:linear-gradient(135deg,var(--dark),#5c3d18); padding:32px 36px 28px; }
.auth-logo { font-family:'Playfair Display',serif; font-size:1.3rem; color:#fff; font-weight:700; display:block; margin-bottom:20px; }
.auth-logo span { color:var(--gold-light); }
.auth-header h1 { font-family:'Playfair Display',serif; font-size:1.6rem; color:#fff; margin-bottom:6px; }
.auth-header p  { color:rgba(255,255,255,.55); font-size:.875rem; }
.auth-body { padding:32px 36px; }
.auth-form { display:flex; flex-direction:column; gap:18px; }

.divider { display:flex; align-items:center; gap:12px; color:var(--muted); font-size:.8rem; }
.divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border); }

.show-pw { position:relative; }
.show-pw input { padding-right:48px; }
.eye-btn {
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  background:none; border:none; color:var(--muted); cursor:pointer;
  display:flex; align-items:center; padding:4px;
}
.eye-btn:hover { color:var(--gold); }

.btn-loading { opacity:.7; pointer-events:none; }
</style>
</head>
<body>
<div id="nav-slot"></div>

<div class="auth-page">
  <div class="auth-bg-photo"></div>
  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="auth-logo">Serenity <span>Spot</span></a>
      <h1>Welcome back</h1>
      <p>Sign in to manage your bookings</p>
    </div>
    <div class="auth-body">
      <div class="auth-form">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" class="form-control" id="lEmail" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="show-pw">
            <input type="password" class="form-control" id="lPw" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" autocomplete="current-password">
            <button class="eye-btn" onclick="togglePw('lPw',this)" type="button" aria-label="Toggle password">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div style="text-align:right;margin-top:-8px">
          <a href="#" style="font-size:.82rem;color:var(--gold)">Forgot password?</a>
        </div>
        <button class="btn btn-primary btn-full btn-lg" id="loginBtn" onclick="doLogin()">Sign In &rarr;</button>
        <p id="loginErr" style="font-size:.82rem;color:var(--error);text-align:center;min-height:16px"></p>
      </div>

      <div class="divider" style="margin:20px 0">or</div>
      <button class="btn btn-ghost btn-full" onclick="alert('Google OAuth &mdash; connect to your identity provider')">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>

      <p style="text-align:center;font-size:.875rem;color:var(--muted);margin-top:20px">
        Don't have an account? <a href="register.html" style="color:var(--gold);font-weight:600">Register here</a>
      </p>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
document.getElementById('nav-slot').innerHTML = navHTML('');
sharedInit();

// Allow Enter key to submit
document.getElementById('lPw').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

function togglePw(id, btn){
  const el = document.getElementById(id);
  const open = el.type === 'password';
  el.type = open ? 'text' : 'password';
  btn.innerHTML = open
    ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
    : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
}

async function doLogin(){
  const email = document.getElementById('lEmail').value.trim();
  const pw    = document.getElementById('lPw').value;
  const err   = document.getElementById('loginErr');
  const btn   = document.getElementById('loginBtn');

  if(!email || !pw) { err.textContent = 'Please fill in all fields.'; return; }
  err.textContent = '';
  btn.textContent = 'Signing in…';
  btn.classList.add('btn-loading');

  try {
    const resp = await fetch(`${API_BASE}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pw })
    });
    const data = await resp.json();
    if(!resp.ok) throw new Error(data.detail || 'Login failed');

    // Store token and user info
    localStorage.setItem('ss_token', data.token);
    localStorage.setItem('ss_user', JSON.stringify(data.user));

    // Redirect based on role
    if(data.user.role === 'admin') {
      window.location = 'admin.html';
    } else {
      window.location = 'index.html';
    }
  } catch(e) {
    err.textContent = e.message;
    btn.textContent = 'Sign In &rarr;';
    btn.classList.remove('btn-loading');
  }
}
</script>
</body>
</html>
