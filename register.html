<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register &mdash; Serenity Spot</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.auth-page {
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:calc(var(--nav-h)+32px) 5% 60px;
  background:linear-gradient(145deg,#120d04 0%,#3a2510 50%,#5c3d18 100%);
  position:relative; overflow:hidden;
}
.auth-bg-photo {
  position:absolute; inset:0;
  background-image:url('https://images.unsplash.com/photo-1590490360182-c33d57733427?w=1400&q=70');
  background-size:cover; background-position:center;
  opacity:.18;
}
.auth-card {
  background:var(--white); border-radius:24px; overflow:hidden;
  width:100%; max-width:520px; position:relative; z-index:1;
  box-shadow:0 24px 80px rgba(26,18,8,.35);
}
.auth-header { background:linear-gradient(135deg,var(--dark),#5c3d18); padding:28px 36px; }
.auth-logo { font-family:'Playfair Display',serif; font-size:1.3rem; color:#fff; font-weight:700; display:block; margin-bottom:16px; }
.auth-logo span { color:var(--gold-light); }
.auth-header h1 { font-family:'Playfair Display',serif; font-size:1.5rem; color:#fff; margin-bottom:4px; }
.auth-header p { color:rgba(255,255,255,.55); font-size:.875rem; }
.auth-body { padding:28px 36px; display:flex; flex-direction:column; gap:14px; }
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }

.show-pw { position:relative; }
.show-pw input { padding-right:48px; }
.eye-btn {
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  background:none; border:none; color:var(--muted); cursor:pointer;
  display:flex; align-items:center; padding:4px;
}
.eye-btn:hover { color:var(--gold); }

.terms-check { display:flex; align-items:flex-start; gap:10px; font-size:.82rem; color:var(--muted); }
.terms-check input { margin-top:3px; accent-color:var(--gold); width:15px; height:15px; }
.terms-check a { color:var(--gold); }

.pw-strength { height:4px; border-radius:4px; margin-top:6px; background:var(--border); transition:all .3s; }
.pw-strength.weak   { background:#e74c3c; width:30%; }
.pw-strength.fair   { background:#f39c12; width:60%; }
.pw-strength.strong { background:#2A7A50; width:100%; }

.btn-loading { opacity:.7; pointer-events:none; }

@media(max-width:500px){ .two-col { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div id="nav-slot"></div>

<div class="auth-page">
  <div class="auth-bg-photo"></div>
  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="auth-logo">Serenity <span>Spot</span></a>
      <h1>Create Account</h1>
      <p>Join Serenity Spot to book and manage your stays</p>
    </div>
    <div class="auth-body">
      <div class="two-col">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" class="form-control" id="rFirst" placeholder="Jane" autocomplete="given-name">
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" class="form-control" id="rLast" placeholder="Wanjiku" autocomplete="family-name">
        </div>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" class="form-control" id="rEmail" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" class="form-control" id="rPhone" placeholder="+254 7XX XXX XXX" autocomplete="tel">
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="show-pw">
          <input type="password" class="form-control" id="rPw" placeholder="Min. 8 characters" oninput="checkStrength(this.value)" autocomplete="new-password">
          <button class="eye-btn" onclick="togglePw('rPw',this)" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="pw-strength" id="pwBar"></div>
        <p id="pwHint" style="font-size:.72rem;color:var(--muted);margin-top:4px"></p>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <div class="show-pw">
          <input type="password" class="form-control" id="rPw2" placeholder="Repeat password" autocomplete="new-password">
          <button class="eye-btn" onclick="togglePw('rPw2',this)" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <label class="terms-check">
        <input type="checkbox" id="rTerms">
        <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
      </label>
      <button class="btn btn-primary btn-full btn-lg" id="regBtn" onclick="doRegister()">Create Account &rarr;</button>
      <p id="rErr" style="font-size:.82rem;color:var(--error);text-align:center;min-height:16px"></p>
      <p style="text-align:center;font-size:.875rem;color:var(--muted)">
        Already have an account? <a href="login.html" style="color:var(--gold);font-weight:600">Sign in</a>
      </p>
    </div>
  </div>
</div>

<script src="shared.js"></script>
<script>
document.getElementById('nav-slot').innerHTML = navHTML('');
sharedInit();

function togglePw(id, btn){
  const el = document.getElementById(id);
  const open = el.type === 'password';
  el.type = open ? 'text' : 'password';
  btn.innerHTML = open
    ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
    : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
}

function checkStrength(pw){
  const bar  = document.getElementById('pwBar');
  const hint = document.getElementById('pwHint');
  if(!pw){ bar.className='pw-strength'; hint.textContent=''; return; }
  const hasLower = /[a-z]/.test(pw);
  const hasUpper = /[A-Z]/.test(pw);
  const hasNum   = /\d/.test(pw);
  const hasSpec  = /[!@#$%^&*]/.test(pw);
  const score    = [hasLower,hasUpper,hasNum,hasSpec,pw.length>=8].filter(Boolean).length;
  if(score <= 2){ bar.className='pw-strength weak';   hint.textContent='Weak &mdash; add numbers and symbols'; }
  else if(score <= 3){ bar.className='pw-strength fair';   hint.textContent='Fair &mdash; try adding uppercase letters'; }
  else { bar.className='pw-strength strong'; hint.textContent='Strong password &#10003;'; }
}

async function doRegister(){
  const first = document.getElementById('rFirst').value.trim();
  const last  = document.getElementById('rLast').value.trim();
  const email = document.getElementById('rEmail').value.trim();
  const phone = document.getElementById('rPhone').value.trim();
  const pw    = document.getElementById('rPw').value;
  const pw2   = document.getElementById('rPw2').value;
  const terms = document.getElementById('rTerms').checked;
  const err   = document.getElementById('rErr');
  const btn   = document.getElementById('regBtn');

  if(!first||!last)          { err.textContent='Enter your full name.'; return; }
  if(!email||!email.includes('@')) { err.textContent='Enter a valid email.'; return; }
  if(!phone)                 { err.textContent='Enter your phone number.'; return; }
  if(pw.length < 8)          { err.textContent='Password must be at least 8 characters.'; return; }
  if(pw !== pw2)             { err.textContent='Passwords do not match.'; return; }
  if(!terms)                 { err.textContent='Please accept the terms to continue.'; return; }
  err.textContent = '';

  btn.textContent = 'Creating account…';
  btn.classList.add('btn-loading');

  try {
    const resp = await fetch(`${API_BASE}/api/auth/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ first_name: first, last_name: last, email, phone, password: pw })
    });
    const data = await resp.json();
    if(!resp.ok) throw new Error(data.detail || 'Registration failed');

    localStorage.setItem('ss_token', data.token);
    localStorage.setItem('ss_user', JSON.stringify(data.user));
    window.location = 'index.html';
  } catch(e) {
    err.textContent = e.message;
    btn.textContent = 'Create Account &rarr;';
    btn.classList.remove('btn-loading');
  }
}
</script>
</body>
</html>
